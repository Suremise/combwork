# Checks every push to main and every pull request: types, lint, unit tests and the translations' checks.
# The end-to-end suites (tests/e2e) need the real Claude Code and Codex CLIs and sign-ins, so they run
# locally before releases (npm run e2e), not here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push cancels a run still going for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: windows-latest
    # HI-3381: the unit run in three shards, each a job of its own with one worker (HI-3355: one file at a time on this
    # 4-vCPU runner, so a hung run's bounds hold), so the run takes a third of the one-worker run's wall-clock (about 170
    # minutes at most). Shard 1 also runs the checks that aren't unit tests. Every shard reports, whichever fails first.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: unit (shard ${{ matrix.shard }}/3)
    # HI-3378: a hung job ends here, not at GitHub's 6 hours; a shard takes about an hour.
    timeout-minutes: 150
    # HI-3378: the tests' timings on this runner, in one file (merged over tests/timing.json by name).
    env:
      CW_TEST_TIMING: tests/timing.ci.json
    steps:
      - uses: actions/checkout@v5
        with:
          # The i18n guard compares the allowlists with the merge base's, so it needs the history.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Electron's binary (HI-2751): npm 11 blocks install scripts, so `npm ci` leaves it out and the first test to
      # load Electron used to download it mid-run, with no retry: a GitHub 504 failed scattered files. It's fetched
      # here instead, from a cache keyed by the Electron version, with retries; a failure says "Electron download
      # failed". The cache is saved as soon as the download succeeds, so a later failing step doesn't lose it.
      - id: electron
        run: echo "version=$(node scripts/installElectronCi.mjs --version)" >> $env:GITHUB_OUTPUT
      - id: electron-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/electron-cache
          key: electron-${{ runner.os }}-${{ steps.electron.outputs.version }}
      - name: Install Electron
        run: node scripts/installElectronCi.mjs
        env:
          electron_config_cache: ${{ runner.temp }}/electron-cache
      - if: steps.electron-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/electron-cache
          key: ${{ steps.electron-cache.outputs.cache-primary-key }}
      # HI-3435: the tests run on the Node inside the Electron Combwork ships, not the latest Node 24 set up above for
      # npm, so they test the SQLite it ships (node:sqlite) and a runner update can't change it. Node 24's modules stay
      # compatible within the major. The check fails the run if the Node now running isn't Electron's.
      - id: electron-node
        run: echo "version=$(node scripts/installElectronCi.mjs --node)" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.electron-node.outputs.version }}
      - run: node scripts/installElectronCi.mjs --check-node
      - if: matrix.shard == 1
        run: npm run typecheck
      - if: matrix.shard == 1
        run: npm run lint
      # One worker per shard (HI-3355), not vitest.config.ts's half the cores (2 on this 4-vCPU runner): with two, the
      # run took 75-95 min and a test file up to 7 min (gitFolderChanges.test.ts 375 s), so condition waits' bounds for a
      # hung run tripped on a different test each run. One file at a time is closer to a normal machine; the shards
      # (HI-3381) bring back the time two workers saved without sharing a runner.
      - run: npm test -- --maxWorkers=1 --shard=${{ matrix.shard }}/3
      # Translations (#768): npm test already runs these; here each has its own line in the log.
      - if: matrix.shard == 1
        run: npm run i18n:extract -- --check
      - if: matrix.shard == 1
        run: npm run i18n:check
      - if: matrix.shard == 1
        run: npm run i18n:guard
      # Agent text (HI-2065): the guard against new hard-coded agent text over every file, as check:repo runs it; its
      # unit test keeps only its rules' cases (HI-2689).
      - if: matrix.shard == 1
        run: npm run agent-text:guard
      # The agent-text catalogue and schema against the code, as check:repo runs it; its unit test reads the catalogue
      # only (HI-3318: the whole-source scan twice, the test's copy past its 20 s on this runner).
      - if: matrix.shard == 1
        run: npm run agent-text:extract -- --check
      # Informational: missing translations show in English and never fail.
      - if: matrix.shard == 1
        run: npm run i18n:coverage

  # HI-3381: GitHub's ruleset requires a check named exactly "check": this job stands for the whole run, and passes only
  # when every shard (shard 1 with the checks that aren't unit tests) passed. It runs whatever they did, so a failed or
  # cancelled shard fails it rather than leaving the required check unreported.
  check:
    if: always()
    needs: [unit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.unit.result }}" = success
