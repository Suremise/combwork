appId: it.surmise.combwork
# The displayed name (#443, HI-2458: Combwork) and the install identity (HI-2460): app ID it.surmise.combwork, installed as
# Combwork.exe in %LOCALAPPDATA%\Programs\Combwork (from executableName). Its installer removes Hive Desktop (appId
# com.hive.desktop) and moves its profile folders (build/installer.nsh, legacyUpgrade.ps1); main sets the profile folder
# (shared/appName.ts).
productName: Combwork
copyright: Copyright © 2026 Darren Marshall
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  - '!**/*.map'
  - '!out/identity/**'
extraResources:
  - from: resources
    to: resources
  # What the build is (#1647, scripts/appIdentity.mjs): local or a release, its version and commit.
  - from: out/identity/build-identity.json
    to: build-identity.json
asarUnpack:
  - '**/node_modules/@lydell/node-pty*/**'
  - out/main/cw-mcp.js
  - out/main/cw-progress.js
  - out/main/cw-close-runner.js
  # Code cw-mcp.js (or cw-progress.js) shares with the main process (e.g. shared/combworkGuidance.ts) is split into chunks,
  # which the CLIs load from outside the asar too.
  - out/main/chunks/**
npmRebuild: false
# Releases (and electron-updater's feed) are on GitHub. npm run dist never publishes; npm run release
# uploads a draft release. See RELEASING.md.
publish:
  provider: github
  owner: Suremise
  repo: combwork
  releaseType: draft
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  executableName: Combwork
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Combwork
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: Combwork-Setup-${version}.${ext}
  deleteAppDataOnUninstall: false
  # Combwork's languages (#767), so the installer, which follows Windows' display language without asking, never speaks one
  # the app doesn't. electron-builder's NSIS messages come in all of them (one or two of its own fall back to English).
  installerLanguages: [en_US, de_DE, es_ES, fr_FR, ja_JP, pl_PL, pt_BR, zh_CN]
  # No resources/elevate.exe (#385): electron-updater only runs it for per-machine installs (or if starting the
  # installer fails with EACCES), and Combwork's per-user installer needs no administrator rights.
  packElevateHelper: false
  # Gives ALL APPLICATION PACKAGES read access to the install folder (installer.nsh).
  include: build/installer.nsh
